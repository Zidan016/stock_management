name: pos_app
description: "Mini Pos App"
publish_to: 'none'
version: 2.4.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.23.0
  drift_flutter: ^0.2.3
  random_string: ^2.3.1
  uuid: ^4.5.1
  get: ^4.7.2
  getwidget: ^7.0.0
  intl: ^0.20.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_bluetooth_printer: ^2.20.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.23.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#FF0000"
  image: assets/logo.png

flutter:
  uses-material-design: true
